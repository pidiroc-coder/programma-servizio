<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programma di Servizio</title>
<meta name="theme-color" content="#0f3d3a">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Programma">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --top:#0f3d3a; --top-txt:#e7f2ef; --top-dim:#b9d6d0; --accent:#f2b544;
  --bg:#f6f3ec; --card:#fffdf8; --line:#e4ddcf; --ink:#1c1917; --dim:#57534e; --label:#6b5d45;
  --pri:#0f5c55; --pri-h:#0a3f3a;
  --ok:#137333; --ok-bg:#e3f1e6; --warn:#8a5a00; --warn-bg:#fdf0d2; --err:#b3261e; --err-bg:#fbe4e1;
  --mod:#fff2a8; --add:#d9f2d0; --del:#f8d0cc;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',sans-serif;font-size:15px}
a{color:var(--pri)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.hidden{display:none!important}
header.top{background:var(--top);color:var(--top-txt);position:sticky;top:0;z-index:20}
header.top .in{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;min-height:60px}
.brand{font-weight:700;font-size:17px;color:#fff}.brand span{color:var(--accent)}
nav.menu{display:flex;flex-wrap:wrap;gap:4px;font-size:14px;font-weight:500}
nav.menu button{background:none;border:0;color:var(--top-txt);padding:8px 13px;border-radius:6px;cursor:pointer;min-height:40px}
nav.menu button.on{background:var(--accent);color:var(--top);font-weight:600}
.who{margin-left:auto;font-size:13px;color:var(--top-dim);display:flex;gap:10px;align-items:center}
.who button{background:none;border:1px solid #3d6b66;color:var(--top-txt);border-radius:6px;padding:5px 10px;cursor:pointer}
main{max-width:1360px;margin:0 auto;padding:22px 16px 80px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
h1{margin:2px 0 14px;font-size:28px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.kpi .l{font-size:12px;color:var(--dim)}.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600}
a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:6px;border:1px solid var(--pri);background:var(--card);color:var(--pri);font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-h)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.err{border-color:var(--err);color:var(--err)}
.btn.small{min-height:34px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{font-family:'IBM Plex Sans','Segoe UI',sans-serif;display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.err{background:var(--err-bg);color:var(--err)}
.chip.mod{background:var(--mod);color:#5c4a00}.chip.add{background:var(--add);color:#1d5a12}.chip.del{background:var(--del);color:#8c1d14}
.msg{padding:10px 14px;border-radius:6px;margin:0 0 12px;font-size:14px}
.msg.err{background:var(--err-bg);color:var(--err)}.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
/* login */
.login{max-width:380px;margin:9vh auto 0}
.login .card{padding:26px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--label)}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:15px;border:1px solid #cfc6b4;border-radius:6px;padding:9px 10px;background:#fff;min-height:42px;width:100%}
label.f.miss input,label.f.miss select{border-color:var(--err);background:#fff8f7}
/* giorni */
.days{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.days button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.days button.on{background:var(--top);color:#fff;border-color:var(--top)}
.day{margin:0 0 22px}
.dayhead{display:flex;align-items:baseline;gap:12px;margin:0 0 8px;border-bottom:2px solid var(--top);padding-bottom:4px}
.dayhead h2{margin:0;font-size:18px}
.sede{margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--label);letter-spacing:.06em}
table.rows{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13.5px}
table.rows th{background:#efe9dc;text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--label);padding:6px 8px;border-bottom:1px solid var(--line)}
table.rows td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r-mod td{background:#fffbe0}tr.r-add td{background:#eef9ea}tr.r-del td{background:#fdeceb;text-decoration:line-through;color:#8c1d14}
tr.r-del td.act{text-decoration:none}
tr.r-bozza td{background:repeating-linear-gradient(-45deg,#fffaf0,#fffaf0 8px,#fdf3df 8px,#fdf3df 16px);color:#57534e}
td.act{white-space:nowrap;text-align:right}
.empty{color:var(--dim);font-size:13px;padding:6px 2px}
.badge{display:inline-block;min-width:18px;background:#b3261e;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:5px;line-height:16px;text-align:center}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.notif .t{flex:1;min-width:0}.notif pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;margin:6px 0 0;color:var(--ink)}
.notif .az{display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media (max-width:720px){.notif{flex-wrap:wrap}.notif .az{flex-direction:row;width:100%}}
.tw{overflow-x:auto}
/* editor */
.editor{border:2px solid var(--accent);background:#fffaf0}
.editor .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px 12px}
.editor .wide{grid-column:span 2}
.editor .riga{grid-column:1/-1}
.editor .loc3{grid-column:span 3}
.nobox{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:4px;color:var(--ink)}
label.f .nobox input{width:20px;height:20px;min-height:0;padding:0;margin:0}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #cfc6b4;border-radius:6px;padding:6px;background:#fff;min-height:42px}
label.f.miss .chips{border-color:var(--err);background:#fff8f7}
.chips .ch{display:inline-flex;align-items:center;gap:4px;background:#e6efe9;color:#0f3d3a;border-radius:999px;padding:3px 4px 3px 10px;font-size:13.5px;font-weight:600}
.chips .ch.lib{background:#f1ece0;color:#57534e}
.chips .ch .n{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7}
.chips .ch button{border:0;background:rgba(0,0,0,.08);border-radius:999px;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1}
.chips{padding-right:96px!important}
.chips .tog{position:absolute;right:5px;top:5px;min-height:32px;padding:4px 10px;border:1px solid var(--pri);border-radius:6px;background:#fff;color:var(--pri);font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
.chips .tog.on{background:var(--pri);color:#fff}
.chips input{border:0!important;outline:0;min-height:30px!important;padding:2px 4px!important;flex:1 1 140px;width:auto!important;background:transparent!important}
.sugg{position:absolute;left:-1px;right:-1px;top:100%;z-index:15;background:#fff;border:1px solid #cfc6b4;border-radius:0 0 6px 6px;box-shadow:0 6px 16px rgba(0,0,0,.12);max-height:260px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
.sugg div:hover,.sugg div.on{background:#fdf0d2}
.sugg small{color:var(--dim)}
.sugg .nores{cursor:default;color:var(--warn);font-size:13px}.sugg .nores:hover{background:#fff}
/* aliquote */
.aq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fffdf8}
.aq .frase{font-size:13.5px;color:var(--dim);margin:0 0 6px;line-height:1.35}
.aq label.al{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;font-weight:400;cursor:pointer}
.aq label.al input{width:20px;height:20px;accent-color:var(--pri);flex:none}
.aq .prev{margin-left:auto;font-size:11px;background:#e3efe9;color:var(--ok);border-radius:10px;padding:2px 8px}
.aq .altre{margin-top:10px;border:2px dashed #c99a2e;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;background:#fff8e6;font-size:14px;cursor:pointer}
.aq .altre input{width:20px;height:20px;accent-color:#8a5a00;flex:none}
.chip.att{background:#e6eaf5;color:#2b3f7a}.chip.imp{background:#ece3f7;color:#5b2d8a}
.labg td,.labg th{text-align:center}.labg td:first-child,.labg th:first-child{text-align:left}
.piede{max-width:1180px;margin:10px auto 24px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.piede button{border:0;background:none;color:var(--pri);font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;padding:8px 0;text-decoration:underline}
/* una linea rossa tra un'uscita e l'altra dello stesso giorno/sede */
table.rows.uscite tbody tr + tr td{border-top:3px solid #c0392b}
.sotto{font-size:12.5px;color:var(--dim);margin-top:2px}.sotto span{font-weight:600;color:var(--label)}
.pill{display:inline-block;background:#fff8e6;color:var(--warn);border:1px solid #e9c97a;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
.aqris{font-size:12.5px;color:var(--pri);font-weight:600;margin-top:2px}
.perc{margin-top:6px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:12px;font-weight:400;color:var(--dim)}
.bar{height:8px;background:#e8e1d2;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.bar.over i{background:var(--err)}.bar.near i{background:var(--accent)}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:92vw}
.spin{position:fixed;inset:0;background:rgba(246,243,236,.55);display:flex;align-items:center;justify-content:center;z-index:40;font-weight:600;color:var(--top)}
@media (max-width:720px){
  h1{font-size:23px}
  .editor .wide,.editor .loc3{grid-column:span 1}
  table.rows:not(.griglia) thead{display:none}
  table.rows:not(.griglia),table.rows:not(.griglia) tbody,table.rows:not(.griglia) tr,table.rows:not(.griglia) td{display:block;width:100%}
  table.rows:not(.griglia) tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.rows.uscite tbody tr{border-bottom:0;padding:8px 0}
  table.rows.uscite tbody tr + tr{border-top:3px solid #c0392b}
  table.rows.uscite tbody tr + tr td{border-top:0}
  table.rows:not(.griglia) td{border:0;padding:2px 10px}
  header.top .in{padding:6px 12px;gap:6px 10px;min-height:0}
  .brand{order:1;font-size:16px}
  .who{order:2;font-size:12px;gap:6px}.who button{padding:4px 8px}
  nav.menu{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
  nav.menu::-webkit-scrollbar{display:none}
  nav.menu button{flex:none;min-height:36px;padding:6px 11px}
  table.griglia{font-size:13px}table.griglia th,table.griglia td{padding:6px 7px;white-space:nowrap}
  table.griglia th:first-child,table.griglia td:first-child{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}
  table.griglia thead th:first-child{background:#efe9dc}
  table.rows:not(.griglia) td[data-l]::before{content:attr(data-l) ': ';font-weight:600;color:var(--label);font-size:12px}
  table.rows:not(.griglia) td.act{text-align:left;padding-top:6px;white-space:normal;display:flex!important;flex-wrap:wrap;gap:6px}
  table.rows:not(.griglia) td.vu{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
var API = (window.PDS_CONFIG && window.PDS_CONFIG.API_URL) || '';
var S = { token: null, utente: null, liste: null, sett: null, vista: 'compila', giorno: null, ed: null, msg: null };
var GIORNI = { LUN: 'Lunedì', MAR: 'Martedì', MER: 'Mercoledì', GIO: 'Giovedì', VEN: 'Venerdì', SAB: 'Sabato' };
var CAMPI = ['uoc','auto','loc','guida','aff','art','eq','cdc','p','r','mat','n','tipo','aliq','att'];

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3500); }
var nSpin = 0;
function spin(on){ nSpin += on ? 1 : -1; var el = $('spin'); if (nSpin > 0 && !el) { el = document.createElement('div'); el.id = 'spin'; el.className = 'spin'; el.textContent = 'Attendere…'; document.body.appendChild(el); } if (nSpin <= 0 && el) { nSpin = 0; el.remove(); } }

// lettura "subito e poi aggiornata": mostra l'ultima risposta nota, poi quella nuova
var MEMO = {};
function leggi(azione, dati, disegnaFn){
  var k = azione + JSON.stringify(dati || {});
  if (MEMO[k]) { try { disegnaFn(MEMO[k], true); } catch (e) {} }
  return api(azione, dati, true).then(function(r){ var cambiato = JSON.stringify(r) !== JSON.stringify(MEMO[k]); MEMO[k] = r; if (cambiato) disegnaFn(r, false); return r; });
}
function api(azione, dati, silenzioso){
  if (!API) return Promise.reject(new Error('Manca API_URL in config.js'));
  var body = Object.assign({}, dati || {}, { azione: azione, token: S.token });
  if (!silenzioso) spin(true);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) {
        if (j.errore === 'SESSIONE_SCADUTA') { esci(true); throw new Error('Sessione scaduta: accedi di nuovo.'); }
        if (j.errore === 'SESSIONE_CAMBIATA') { esci(true); vistaLogin('Il tuo accesso è cambiato (utente disattivato o ruolo modificato): entra di nuovo.'); throw new Error('Accesso cambiato: entra di nuovo.'); }
        if (j.errore === 'CAMBIO_PASSWORD') { vistaCambioObbligatorio(''); throw new Error('Scegli prima una nuova password.'); }
        throw new Error(j.errore || 'Errore');
      }
      return j.dati;
    })
    .finally(function(){ if (!silenzioso) spin(false); });
}

function ruolo(){ return S.utente ? S.utente.ruolo : ''; }
function puoCompilare(){ return ['COMPILATORE','DIRIGENTE','ADMIN'].indexOf(ruolo()) !== -1; }
function isDir(){ return ruolo() === 'DIRIGENTE' || ruolo() === 'ADMIN'; }
function isAdmin(){ return ruolo() === 'ADMIN'; }
function isLab(){ return !!((S.utente && S.utente.lab) || (S.sett && S.sett.lab)); }
function isAnalista(){ return !!((S.utente && S.utente.analista) || (S.sett && S.sett.analista) || isLab()); }
function puoModificare(){ var p = F() && F().programma; return puoCompilare() && !(p && p.archivio && !p.modificabile && !isAdmin()); }

// ---------------- avvio / login ----------------
function avvio(){
  S.token = ls('pds_token');
  try { S.utente = JSON.parse(ls('pds_utente') || 'null'); } catch (e) { S.utente = null; }
  if (!S.token || !S.utente) return vistaLogin();
  caricaTutto();
}

function vistaLogin(err){
  $('app').innerHTML =
    '<div class="login"><div class="eyebrow">ARPA Molise · UOC Servizi Laboratoristici</div><h1>Programma di Servizio</h1>' +
    '<form class="card grid" id="flog" autocomplete="on">' + (err ? '<div class="msg err">' + esc(err) + '</div>' : '') +
    '<label class="f">Nome utente<input name="u" autocomplete="username" required autocapitalize="none"></label>' +
    '<label class="f">Password<input name="p" type="password" autocomplete="current-password" required></label>' +
    '<button class="btn pri" type="submit">Accedi</button>' +
    '<div style="font-size:12px;color:var(--dim)">Le credenziali le crea l\'amministratore. Dopo 5 tentativi errati l\'accesso si blocca per 15 minuti.</div>' +
    '</form></div>';
  $('flog').onsubmit = function(e){
    e.preventDefault();
    var f = e.target;
    api('login', { utente: f.u.value.trim(), password: f.p.value }).then(function(d){
      S.token = d.token; S.utente = d.utente;
      ls('pds_token', d.token); ls('pds_utente', JSON.stringify(d.utente));
      if (d.cambioObbligatorio) vistaCambioObbligatorio(f.p.value);
      else caricaTutto();
    }).catch(function(er){ vistaLogin(er.message); });
  };
}

// Primo accesso con password temporanea: si deve scegliere una password nuova
function vistaCambioObbligatorio(temporanea, err){
  $('app').innerHTML =
    '<div class="login"><div class="eyebrow">Primo accesso</div><h1>Scegli la tua password</h1>' +
    '<form class="card grid" id="fcam">' + (err ? '<div class="msg err">' + esc(err) + '</div>' : '') +
    '<div style="font-size:14px">Ciao <b>' + esc(S.utente.nome || S.utente.username) + '</b>, stai usando una password temporanea data dall\'amministratore. Per continuare scegline una tua: la conosci solo tu.</div>' +
    (temporanea ? '' : '<label class="f">Password temporanea<input type="password" name="a" autocomplete="current-password" required></label>') +
    '<label class="f">Nuova password (almeno 10 caratteri, niente nome utente o sequenze)<input type="password" name="n" autocomplete="new-password" minlength="10" required></label>' +
    '<label class="f">Ripeti nuova password<input type="password" name="r" autocomplete="new-password" minlength="10" required></label>' +
    '<button class="btn pri" type="submit">Salva e continua</button><button class="btn" type="button" id="bescc">Esci</button></form></div>';
  $('bescc').onclick = function(){ esci(); };
  $('fcam').onsubmit = function(e){
    e.preventDefault(); var f = e.target;
    var vecchia = temporanea || f.a.value;
    if (f.n.value !== f.r.value) return vistaCambioObbligatorio(temporanea, 'Le due password non coincidono.');
    api('cambiaPassword', { vecchia: vecchia, nuova: f.n.value }).then(function(d){
      S.utente = d.utente; ls('pds_utente', JSON.stringify(d.utente));
      toast('Password salvata'); caricaTutto();
    }).catch(function(er){ vistaCambioObbligatorio(temporanea, er.message); });
  };
}

function esci(silenzioso){
  if (!silenzioso && !confirm('Uscire?\nSu questo telefono non arriveranno più notifiche finché non rientri.')) return;
  var tok = ls('pds_push_tok');
  if (tok && S.token) { ls('pds_push_tok', null); api('pushRimuovi', { fcmToken: tok }, true).catch(function(){}).then(function(){ if (!silenzioso) api('logout', {}, true).catch(function(){}); }); }
  else if (!silenzioso && S.token) api('logout', {}, true).catch(function(){});
  ls('pds_token', null); ls('pds_utente', null); MEMO = {};
  S.token = null; S.utente = null; S.ed = null;
  vistaLogin();
}

var COMUNI = null;
function caricaComuni(){
  if (COMUNI) return Promise.resolve(COMUNI);
  return fetch('comuni.json').then(function(r){ return r.json(); }).then(function(j){ COMUNI = j; return j; }).catch(function(){ COMUNI = []; return COMUNI; });
}

function caricaTutto(){

    S.liste = r[0]; S.sett = r[1];
    S.vista = 'dash';   // l'app si apre sempre sulla Dashboard (o sulla pagina indicata dalla notifica)

// scrittura: un solo giro col server, che risponde già con la settimana (o il programma d'archivio) aggiornata
function scrivi(azione, dati, silenzioso){
  dati = Object.assign({}, dati || {});

// "+ Uscita fuori programma" da Le mie uscite: si sceglie il programma approvato ancora modificabile

  api('archivio').then(function(a){
    var mod = a.filter(function(x){ return x.modificabile; });
    if (!mod.length) return toast('Nessun programma approvato modificabile (si può aggiungere fino al sabato della sua settimana).');
    var apri = function(n){ apriArchivio(n, function(){ apriFuori(prefill); }); };

// ---------------- attività (foglio ATTIVITA') e luoghi (foglio LUOGHI) ----------------
function attivita(){ return (S.liste && S.liste.attivita) || []; }
function attInfo(nome){ nome = String(nome || '').toUpperCase(); return attivita().filter(function(a){ return a.nome === nome; })[0] || null; }
// righe salvate prima delle attività: con campioni = campionamento, senza = la prima uscita con campioni eventuali (sopralluogo)
function attDi(r){
  if (r.att && !attInfo(r.att) && attivita().length) return { nome: String(r.att).toUpperCase(), uscita: !(String(r.auto || '').toUpperCase() === 'NO AUTO' && !(Number(r.n) > 0)), campioni: Number(r.n) > 0 ? 'SI' : 'NO', sconosciuta: true };
  var a = attInfo(r.att); if (a) return a;
  if (Number(r.n) > 0) return attivita().filter(function(x){ return x.campioni === 'SI'; })[0] || null;
  return attivita().filter(function(x){ return x.uscita && x.campioni === 'EVENTUALI'; })[0] || null;
}
function attChip(r){ var a = attDi(r); if (!a) return ''; return ' <span class="chip ' + (a.uscita ? 'att' : 'imp') + '">' + esc(bello(a.nome).replace(/\//g, ' / ')) + '</span>' + (a.sconosciuta ? ' <span class="chip warn" title="Rinominata o tolta dal foglio ATTIVITA\': modifica la riga e scegli l\'attività">⚠ attività non più nel foglio ATTIVITA\'</span>' : ''); }
function luoghi(){
  var l = (S.liste && S.liste.luoghi) || [];
  if (l.length) return l;
  return (F().sedi || []).map(function(x){ return { luogo: x, blocco: x }; }).concat([{ luogo: 'ONLINE', blocco: '' }]);
}
var ALTRO_LUOGO = 'ALTRO LUOGO…';
// "SEDE CB – Sala 2 (Riunione PFAS)" <-> { luogo, altro, sala, descr }
function luogoParse(loc){
  loc = String(loc || '').trim();
  var o = { luogo: '', altro: '', sala: '', descr: '' };
  var m = loc.match(/^(.*?)\s*\(([^()]*)\)\s*$/); if (m) { loc = m[1]; o.descr = m[2]; }
  var noto = luoghi().map(function(x){ return x.luogo; }).sort(function(a, b){ return b.length - a.length; }).filter(function(x){ return loc.toUpperCase().indexOf(x) === 0; })[0];
  var resto;
  if (noto) { o.luogo = noto; resto = loc.slice(noto.length); }
  else { var i = loc.indexOf(' – '); o.luogo = loc ? ALTRO_LUOGO : ''; o.altro = i === -1 ? loc : loc.slice(0, i); resto = i === -1 ? '' : loc.slice(i); }
  o.sala = resto.replace(/^\s*–\s*/, '').trim();
  return o;
}
function luogoComponi(d, lu){
  var base = lu.luogo === ALTRO_LUOGO ? String(lu.altro || '').trim().toUpperCase() : lu.luogo;
  d.loc = base ? base + (lu.sala ? ' – ' + lu.sala : '') + (lu.descr ? ' (' + lu.descr + ')' : '') : '';
}

// testo salvato: "C-CHIMICA DI BASE; B-MICROBIOLOGIA; + ALTRE AL CAMPIONAMENTO" oppure "DA DEFINIRE AL CAMPIONAMENTO"
var AQ_TUTTE = 'DA DEFINIRE AL CAMPIONAMENTO', AQ_ALTRE = '+ ALTRE AL CAMPIONAMENTO';
function tipoObj(mat, tipo){ return tipiDi(mat).filter(function(x){ return x.tipo === tipo; })[0] || null; }
function aqDa(t, conf){
  t = String(t || '').trim();
  if (t === AQ_TUTTE) return { sel: [], altre: false, tutte: true, conf: !!conf };
  var v = t ? t.split(';').map(function(x){ return x.trim(); }).filter(String) : [];
  var altre = v.indexOf(AQ_ALTRE) !== -1;
  return { sel: v.filter(function(x){ return x !== AQ_ALTRE; }), altre: altre, tutte: false, conf: !!conf };
}
function aqPredef(t){ return { sel: (t ? t.aliquote : []).filter(function(a){ return a.def; }).map(function(a){ return a.nome; }), altre: false, tutte: false, conf: false }; }
function aqStr(a){ if (a.tutte || (!a.sel.length && a.altre)) return AQ_TUTTE; return a.sel.concat(a.altre ? [AQ_ALTRE] : []).join('; '); }
function bello(x){ var m = String(x).match(/^([A-Z0-9]+-)(.*)$/); var r = m ? m[2] : String(x); r = r.charAt(0) + r.slice(1).toLowerCase(); return (m ? m[1] : '') + r; }
function aqTesto(t){
  t = String(t || '').trim(); if (!t) return '';
  if (t === AQ_TUTTE) return '<span class="pill">Aliquote da decidere al campionamento</span>';
  var a = aqDa(t);
  return '<span>' + esc(a.sel.map(bello).join(' · ')) + '</span>' + (a.altre ? ' <span class="pill">+ altre al campionamento</span>' : '');
}
// riquadro con le caselle; pre = prefisso degli id (editor / finestra)
function aqHtml(t, a, pre){
  if (!t) return '';
  if (t.noCampioni) return '<div class="hint">Nessun campione previsto per questo tipo di intervento.</div>';
  if (!t.aliquote.length) return '';
  if (a.conf) return '<div class="aq"><div class="row" style="justify-content:space-between"><b style="font-size:13px;color:var(--label)">ALIQUOTE</b><button type="button" class="btn small" id="' + pre + 'aqmod">✎ Modifica</button></div><div class="aqris">' + aqTesto(aqStr(a)) + '</div></div>';
  var conDef = t.aliquote.some(function(x){ return x.def; });
  var h = '<div class="aq"><p class="frase">' + (conDef ? 'Sono già spuntate le aliquote previste per <b>«' + esc(t.tipo) + '»</b>. Togli o aggiungi quelle che servono.' : 'Per <b>«' + esc(t.tipo) + '»</b> non ci sono aliquote previste: spunta quelle che servono, oppure decidile al campionamento.') + '</p>';
  t.aliquote.forEach(function(x, i){ h += '<label class="al"><input type="checkbox" data-aq="' + i + '"' + (a.sel.indexOf(x.nome) !== -1 ? ' checked' : '') + '>' + esc(x.nome) + (x.def ? '<span class="prev">prevista</span>' : '') + '</label>'; });
  h += '<label class="altre"><input type="checkbox" id="' + pre + 'aqaltre"' + (a.altre ? ' checked' : '') + '><span><b>Altre da decidere al campionamento</b><br><span class="hint">Se sul posto servono altre aliquote, si aggiungono lì.</span></span></label>';
  h += '<div class="row" style="margin-top:10px"><button type="button" class="btn pri" id="' + pre + 'aqok">Conferma aliquote</button><button type="button" class="btn" id="' + pre + 'aqtutte">Tutte da decidere al campionamento</button></div></div>';
  return h;
}
// collega le caselle; fatto(a) viene chiamato a ogni conferma/modifica
function aqCollega(box, t, a, pre, fatto){
  if (!box || !t) return;
  box.querySelectorAll('[data-aq]').forEach(function(c){ c.onchange = function(){ var n = t.aliquote[Number(c.dataset.aq)].nome; a.sel = a.sel.filter(function(x){ return x !== n; }); if (c.checked) a.sel = t.aliquote.map(function(x){ return x.nome; }).filter(function(x){ return x === n || a.sel.indexOf(x) !== -1; }); }; });
  var al = $(pre + 'aqaltre'); if (al) al.onchange = function(){ a.altre = this.checked; };
  var ok = $(pre + 'aqok'); if (ok) ok.onclick = function(){ a.tutte = !a.sel.length; a.conf = true; fatto(a); };
  var tu = $(pre + 'aqtutte'); if (tu) tu.onclick = function(){ a.sel = []; a.altre = false; a.tutte = true; a.conf = true; fatto(a); };
  var md = $(pre + 'aqmod'); if (md) md.onclick = function(){ a.conf = false; a.tutte = false; fatto(a); };
}

// ---------------- tipo di intervento e verbali ----------------
function tipiDi(mat){ return ((S.liste && S.liste.tipi) || []).filter(function(t){ return t.mat === mat; }); }
function codiciVerb(t){ return String(t || '').split(';').map(function(x){ return x.trim(); }).filter(String); }
function verbStd(c){ return /^(M\d+\.\d+-\d|N\.\d)/i.test(c); }   // codice modulo; altrimenti "usare verbale specifico"
// piano di stampa: verbali × numero campioni + allegati × 1
function pianoVerbali(mat, tipo, n){
  var t = tipiDi(mat).filter(function(x){ return x.tipo === tipo; })[0];
  if (!t) return null;
  var ver = codiciVerb(t.verbali), all = codiciVerb(t.allegati);
  return { n: Number(n) > 0 ? Number(n) : 1, verbali: ver.filter(verbStd), allegati: all.filter(verbStd), specifico: ver.some(function(c){ return !verbStd(c); }) };
}
function tastoVerbali(mat, tipo, n, piccolo){
  if (!tipo || !(Number(n) > 0)) return '';
  var pv = pianoVerbali(mat, tipo, n); if (!pv) return '';
  var sm = piccolo ? ' small' : '';
  var dati = ' data-vmat="' + esc(mat) + '" data-vtipo="' + esc(tipo) + '" data-vn="' + esc(n) + '"';
  var corto = function(c){ return c.replace(/_REV.*$/i, ''); };
  if (!pv.verbali.length && !pv.allegati.length) return '<button class="btn' + sm + '" disabled title="Per questo intervento si usa un verbale specifico">USARE VERBALE SPECIFICO</button>';
  if (!pv.verbali.length) return '<button class="btn pri' + sm + '"' + dati + '>⬇ Scarica allegato ' + esc(pv.allegati.map(corto).join(' + ')) + '</button>' + (piccolo ? '' : ' <span class="hint">Verbale: usare verbale specifico</span>');
  var lab = pv.verbali.map(function(c){ return pv.n + '× ' + corto(c); }).concat(pv.allegati.map(function(c){ return '1× ' + corto(c); })).join(' + ');
  return '<button class="btn pri' + sm + '"' + dati + ' title="' + esc(lab) + '">⬇ ' + (piccolo ? 'Verbali' : 'Scarica verbali (' + esc(lab) + ')') + '</button>';
}
function collegaVerbali(){ document.querySelectorAll('[data-vtipo]').forEach(function(b){ b.onclick = function(){ scaricaVerbali(b.dataset.vmat, b.dataset.vtipo, b.dataset.vn); }; }); }
var PDFLIB = null, VERB_CACHE = {};
function caricaPdfLib(){
  if (window.PDFLib) return Promise.resolve();
  return new Promise(function(ok, ko){ var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'; sc.integrity = 'sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI'; sc.crossOrigin = 'anonymous'; sc.onload = ok; sc.onerror = function(){ ko(new Error('Non riesco a caricare il modulo PDF: controlla la connessione.')); }; document.head.appendChild(sc); });
}
function b64(x){ var bin = atob(x), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr; }
function scaricaVerbali(mat, tipo, n){
  var pv = pianoVerbali(mat, tipo, n); if (!pv) return;
  var tutti = pv.verbali.concat(pv.allegati);
  var mancano = tutti.filter(function(c){ return !VERB_CACHE[c]; });
  spin(true);
  Promise.all([caricaPdfLib(), mancano.length ? api('verbali', { codici: mancano }, true) : Promise.resolve([])]).then(function(r){
    r[1].forEach(function(f){ VERB_CACHE[f.codice] = b64(f.base64); });
    var P = window.PDFLib;
    return P.PDFDocument.create().then(function(out){
      var seq = [];
      pv.verbali.forEach(function(c){ for (var i = 0; i < pv.n; i++) seq.push(c); });
      pv.allegati.forEach(function(c){ seq.push(c); });
      var docs = {};
      return tutti.reduce(function(pr, c){ return pr.then(function(){ return P.PDFDocument.load(VERB_CACHE[c], { ignoreEncryption: true }).then(function(d){ docs[c] = d; }); }); }, Promise.resolve())

  var az = '';

  if (r.stato !== 'Annullata' && puoModificare() && serveTipo(r)) az += ' <button class="btn small warn" data-taq="' + r.riga + '">Scegli tipo e aliquote</button>';
  if (p.archivio && r.oggi && isDir() && r.stato !== 'Annullata' && !(attDi(r) && !attDi(r).uscita) && !/^(ANNULLATA|DA RIPROGRAMMARE|RINVIATA)/.test(r.esito || '')) az += ' <button class="btn small err" data-esarch="' + esc(r.id) + '">⛔ Non si fa</button>';

  return '<tr class="' + cls + '"><td>' + chip + '</td><td data-l="UOC"' + vu('uoc') + '>' + cel('uoc') + '</td><td data-l="Auto"' + vu('auto') + '>' + cel('auto') + '</td><td data-l="' + (attDi(r) && !attDi(r).uscita ? 'Luogo' : 'Comune / Località') + '">' + locHtml(r, cel('loc', locDividi(r).luogo)) + '</td>' +
    '<td data-l="Guida"' + vu('guida') + '>' + cel('guida') + '</td><td data-l="Affidatario"' + vu('aff') + '>' + cel('aff') + '</td><td data-l="' + (attDi(r) && !attDi(r).uscita ? 'Convocati' : 'Equipaggio') + '"' + (eqR.nomi ? '' : ' class="vu"') + '>' + cel('eq', eqR.nomi) + '</td><td data-l="Note"' + (eqR.note ? '' : ' class="vu"') + '>' + esc(eqR.note) + '</td><td data-l="CdC"' + vu('cdc') + '>' + cel('cdc') + '</td>' +
    '<td data-l="Matrice"' + vu('mat') + '>' + cel('mat') + (r.tipo ? '<div class="hint">' + esc(r.tipo) + '</div>' : '') + (r.aliq ? '<div class="aqris">' + aqTesto(r.aliq) + '</div>' : '') + '</td><td data-l="N." class="mono">' + cel('n') + '</td>' +

function dataIt(t){ var m = String(t || '').match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/); if (!m) return Date.now(); var d = new Date(); var x = new Date(d.getFullYear(), Number(m[2]) - 1, Number(m[1]), Number(m[3]), Number(m[4])); if (x > d) x.setFullYear(d.getFullYear() - 1); return x.getTime(); }
function primoGiorno(){ return F().giorni.length ? F().giorni[0].key : 'LUN'; }
function sedeUtente(){
  var s = (S.utente.sede || '').toUpperCase();
  var sedi = F().sedi || [];
  var trovata = sedi.filter(function(x){ return x === s || x === 'SEDE ' + s || x.replace('SEDE ', '') === s; })[0];
  return trovata || sedi[0] || '';
}
function trovaRiga(n){ var t = null; F().giorni.forEach(function(g){ g.blocchi.forEach(function(b){ b.righe.forEach(function(r){ if (r.riga === n) t = { r: r, giorno: g.key, sede: b.sede }; }); }); }); return t; }

function sblocca(n){
  var t = trovaRiga(n); if (!t) return;
  var p = F().programma;
  var testo = p.approvato ? 'Il programma è approvato: la modifica creerà la Rev.' + (p.revApprovata + 1) + ' da far approvare al dirigente. Sbloccare la riga?' : 'Sbloccare la riga per modificarla? Finché non la salvi di nuovo il programma non si può approvare.';
  if (!confirm(testo)) return;
  modificaRiga(n);   // la scheda si apre subito; lo sblocco viaggia in sottofondo
  S.sblocco = scrivi(S.arch ? 'archivioSblocca' : 'sbloccaRiga', { riga: n, id: t.r.id }, true)
    .catch(function(e){ toast(e.message); S.ed = null; vCompila(); throw e; });
}

function modificaRiga(n){
  var t = trovaRiga(n); if (!t) return;
  var d = {}; CAMPI.forEach(function(k){ d[k] = t.r[k]; });
  apriEditor({ riga: n, id: t.r.id, giorno: t.giorno, sede: t.sede, dati: d, codici: t.r.cod, nOrig: t.r.n, matOrig: t.r.mat, uocOrig: t.r.uoc });
}

// ⧉ Duplica: stessa uscita (giorno, sede, località, auto, equipaggio…), matrice / tipo / campioni da scegliere
function duplica(n){
  var t = trovaRiga(n); if (!t) return;
  var d = {}; CAMPI.forEach(function(k){ if (['mat','tipo','n','aliq','p','r'].indexOf(k) === -1) d[k] = t.r[k]; });
  if (!d.att) { var a0 = attDi(t.r); if (a0) d.att = a0.nome; }
  if (F().programma.archivio || F().programma.approvato) return apriFuori(d, t.giorno, t.sede);
  apriEditor({ giorno: t.giorno, sede: t.sede, dati: d, duplicata: true });
}

function eliminaRiga(n){
  var t = trovaRiga(n); if (!t) return;
  var p = F().programma;
  var annulla = p.approvato && !(t.r.modifica === 'AGGIUNTA' && t.r.rev > p.revApprovata);
  var testo = annulla ? 'Annullare l\'uscita "' + t.r.loc + '"? Resterà visibile barrata nella revisione.' : 'Svuotare la riga "' + t.r.loc + '"?' + (t.r.cod ? ' I codici ' + t.r.cod + ' non verranno riutilizzati.' : '');
  if (!confirm(testo)) return;
  scrivi(S.arch ? 'archivioAnnulla' : 'svuotaRiga', { riga: n, id: t.r.id }).then(function(){ toast(annulla ? 'Uscita annullata' : 'Riga svuotata'); vCompila(); }).catch(function(e){ toast(e.message); });

function preparaChips(d){
  if (!d) return;
  if (!d._tappe) {

    var mm = loc.match(/^(.*?)\s*\(([^()]*)\)\s*$/); if (mm) { loc = mm[1]; nota = mm[2]; }
    var tappe = [];
    loc.split(/\s+-\s+|\s*[,;]\s*/).forEach(function(x){
      x = x.trim(); if (!x) return;
      var parti = x.split('-');
      if (!cercaComune(x) && parti.length > 1 && parti.every(function(y){ return cercaComune(y); })) parti.forEach(function(y){ tappe.push(y.trim().toUpperCase()); });
      else tappe.push(cercaComune(x) ? x.toUpperCase() : x);

    d._tappe = tappe; d._locNote = nota;
  }
  if (!d._eq) {
    var eq = String(d.eq || '').trim(), n2 = '';
    var m2 = eq.match(/^(.*?)\s*(\([^()]*\))\s*$/); if (m2) { eq = m2[1]; n2 = m2[2]; }

      if (nomiNoti().indexOf(x.toUpperCase()) !== -1) nomi.push(x.toUpperCase()); else altro.push(x);

      '<div class="days" style="margin:0"><button data-f="aperti" class="' + (S.filtroAvv === 'aperti' ? 'on' : '') + '">Da accettare (' + delProg.filter(aperti).length + ')</button><button data-f="tutti" class="' + (S.filtroAvv === 'tutti' ? 'on' : '') + '">Tutti (' + delProg.length + ')</button></div></div>' +
      '<div class="grid kpis" style="margin-bottom:14px">' + kpi('Inviate', delProg.length) + kpi('Arrivate sul telefono', delProg.filter(arrivata).length) + kpi('Accettate', delProg.filter(acc).length) +

        return '<tr><td data-l="Persona"><b>' + esc(x.nome) + '</b></td><td data-l="Avviso">' + esc(TIPO_N[x.tipo] || x.tipo) + '<div class="hint">' + esc(x.rif.replace(/ USCITA .*$/, '')) + '</div></td>' +

// ---------------- approvazione ----------------
// senza numero: programma della settimana in compilazione + elenco delle Rev. da approvare in archivio
function vApprova(numero){
  $('main').innerHTML = intestazione('Approvazione') + '<div class="empty">Controllo in corso…</div>';
  var chiamate = [api('verificaApprovazione', numero ? { numero: numero } : {})];
  if (!numero) chiamate.push(api('archivio'));
  Promise.all(chiamate).then(function(res){
    var c = res[0];
    var inAttesa = numero ? [] : (res[1] || []).filter(function(x){ return x.revInCorso; });
    var rev = c.tipo === 'revisione';
    var h = numero ? '<div class="eyebrow">Programma n. ' + esc(numero) + ' · ' + esc(c.programma.settimana) + ' · da archivio</div><h1>Approvazione Rev.' + c.rev + '</h1>' +
      '<div class="row" style="margin:-4px 0 14px"><button class="btn small" id="bindietro">← Approvazione</button></div>'
      : intestazione('Approvazione');
    if (inAttesa.length) {
      h += '<section class="card" style="margin-bottom:16px;border-color:var(--accent)"><h2>Revisioni da approvare</h2><ul class="clean">' + inAttesa.map(function(x){
        return '<li class="row"><span class="chip warn">Rev.' + (Number(x.rev) + 1) + '</span><b>Programma n. ' + esc(x.numero) + '</b> <span style="font-size:13px;color:var(--dim)">' + esc(x.settimana) + '</span> <button class="btn small pri" data-rev="' + esc(x.numero) + '">Verifica e approva</button></li>';
      }).join('') + '</ul></section>';
    }
    if (!numero) h += '<h2 style="margin-top:4px">Settimana in compilazione · n. ' + esc(c.programma.numero) + '</h2>';
    if (!c.righe && !rev) {
      h += '<div class="msg warn">Nessuna uscita inserita: non c\'è ancora niente da approvare.</div>';
    } else {
      h += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));align-items:start"><div class="grid">';
      h += '<section class="card"><h2>Controlli</h2><ul class="clean">' +
        chk(c.problemi.length === 0, 'Tutte le righe salvate e complete (' + c.salvate + ' di ' + c.righe + ')') +
        (rev ? '' : chk(c.bozze === 0, c.bozze ? c.bozze + ' bozze non salvate (non entrano nel programma)' : 'Nessuna bozza aperta', true)) + '</ul>' +
        (c.problemi.length ? '<h2 style="margin-top:14px">Da sistemare</h2><ul class="clean" style="font-size:14px">' + c.problemi.map(function(x){ return '<li>• ' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</section>';
      if (rev && numero && c.programma.modificabile === false) h += '<div class="msg warn" style="grid-column:1/-1">Settimana finita: niente nuove modifiche, ma puoi ancora <b>approvare</b> la Rev. o <b>annullare</b> le singole modifiche.</div>';
      if (rev) {
        h += '<section class="card"><h2>Modifiche della Rev.' + c.rev + '</h2><ul class="clean" style="font-size:14px">' + c.modifiche.map(function(m){

function scaricaPdf(id){
  api('pdf', { idFile: id }).then(function(f){
    var bin = atob(f.base64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = f.nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
  }).catch(function(e){ toast(e.message); });
}

// ---------------- notifiche sul telefono (Firebase Cloud Messaging) ----------------
var APP_URL = 'https://pidiroc-coder.github.io/programma-servizio/';
function pushCfg(){ return window.PDS_CONFIG && window.PDS_CONFIG.FIREBASE && window.PDS_CONFIG.VAPID ? window.PDS_CONFIG : null; }
function pushSupportato(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isIos(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function standalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function pushServer(){ return (S.sett && S.sett.push) || { configurato: false, dispositivi: [] }; }
function pushQui(){ return !!ls('pds_push_tok') && pushSupportato() && Notification.permission === 'granted'; }
function nomeDispositivo(){
  var u = navigator.userAgent;
  var sis = /android/i.test(u) ? 'Android' : (isIos() ? (/ipad/i.test(u) ? 'iPad' : 'iPhone') : (/windows/i.test(u) ? 'PC Windows' : (/mac/i.test(u) ? 'Mac' : 'PC')));
  var br = /edg\//i.test(u) ? 'Edge' : (/samsungbrowser/i.test(u) ? 'Samsung' : (/chrome|crios/i.test(u) ? 'Chrome' : (/firefox|fxios/i.test(u) ? 'Firefox' : (/safari/i.test(u) ? 'Safari' : ''))));
  return sis + (br ? ' · ' + br : '');
}
function caricaScript(src){ return new Promise(function(ok, ko){ var sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = function(){ ko(new Error('Non riesco a caricare il modulo notifiche: controlla la connessione.')); }; document.head.appendChild(sc); }); }
function caricaFirebase(){
  if (window.firebase && window.firebase.messaging) return Promise.resolve();
  var v = 'https://www.gstatic.com/firebasejs/10.12.2/';
  return caricaScript(v + 'firebase-app-compat.js').then(function(){ return caricaScript(v + 'firebase-messaging-compat.js'); })
    .then(function(){ if (!window.firebase.apps.length) window.firebase.initializeApp(pushCfg().FIREBASE); });
}
// va chiamata da un clic (iPhone e Chrome lo richiedono)
function attivaPush(){
  if (!pushCfg()) return Promise.reject(new Error('Notifiche non configurate (config.js).'));
  if (!pushSupportato()) return Promise.reject(new Error(isIos() && !standalone() ? 'Su iPhone prima aggiungi l\'app alla schermata Home da Safari e aprila dall\'icona (vedi i passi).' : 'Questo browser non supporta le notifiche: usa Chrome (Android/PC) o Safari con l\'app sulla Home (iPhone).'));
  return Notification.requestPermission().then(function(perm){
    if (perm !== 'granted') throw new Error('Notifiche non consentite. Per sbloccarle: impostazioni del browser → Notifiche → consenti per questo sito, poi riprova.');
    return Promise.all([caricaFirebase(), navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })]);
  }).then(function(r){
    return window.firebase.messaging().getToken({ vapidKey: pushCfg().VAPID, serviceWorkerRegistration: r[1] });
  }).then(function(tok){
    if (!tok) throw new Error('Il telefono non ha dato il codice per le notifiche: riprova.');
    ls('pds_push_tok', tok); ls('pds_push_data', String(Date.now()));
    return api('pushRegistra', { fcmToken: tok, dispositivo: nomeDispositivo() }, true);
  }).then(function(m){ if (S.sett) S.sett.push = m; return m; });
}
function disattivaPush(){
  var t = ls('pds_push_tok');
  ls('pds_push_tok', null);
  var fine = function(){ return t ? api('pushRimuovi', { fcmToken: t }) : Promise.resolve(pushServer()); };
  return caricaFirebase().then(function(){ return window.firebase.messaging().deleteToken(); }).catch(function(){}).then(fine).then(function(m){ if (S.sett) S.sett.push = m; return m; });
}
// una volta al giorno rinnova il codice del telefono (può cambiare) senza chiedere nulla
function rinnovaPush(){
  if (!pushQui() || !pushCfg() || !pushServer().configurato) return;
  var vecchio = Date.now() - Number(ls('pds_push_data') || 0) > 86400000;
  if (!vecchio && pushServer().dispositivi.length) return;
  attivaPush().catch(function(){});
}
function bannerPush(){
  var ps = pushServer();
  if (!ps.configurato || !pushCfg() || (pushQui() && ps.dispositivi.length)) return '';
  if (Date.now() - Number(ls('pds_push_dopo') || 0) < 3 * 86400000) return '';
  return '<div class="msg warn" id="bpushbox">🔔 <b>Attiva le notifiche su questo telefono</b>: ricevi le tue uscite e le modifiche anche con l\'app chiusa.' +
    '<div class="row" style="margin-top:8px"><button class="btn pri small" id="bpush">Attiva notifiche</button><button class="btn small" id="bpushdopo">Più tardi</button></div></div>';
}
function collegaBannerPush(){
  if ($('bpushdopo')) $('bpushdopo').onclick = function(){ ls('pds_push_dopo', String(Date.now())); var b = $('bpushbox'); if (b) b.remove(); };
  if ($('bpush')) $('bpush').onclick = function(){
    if (!pushSupportato() || (isIos() && !standalone())) { S.vista = 'account'; disegna(); return; }
    attivaPush().then(function(){ toast('Notifiche attive su questo telefono'); var b = $('bpushbox'); if (b) b.remove(); })
      .catch(function(e){ toast(e.message); S.vista = 'account'; disegna(); });
  };
}

  else if (isIos() && !standalone()) h += '<div class="msg warn" style="margin:0">Su iPhone il tasto compare solo aprendo l\'app dall\'icona sulla schermata Home (passi qui sopra).</div>';

  if (ps.dispositivi.length) h += '<p class="hint" style="margin:10px 0 0">Attive su: ' + esc(ps.dispositivi.join(', ')) + '</p>';
  h += '<details style="margin-top:12px;font-size:13.5px"><summary style="cursor:pointer;font-weight:600">Le notifiche arrivano solo come icona in alto?</summary>' +
    '<ol style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>Abbassa la tendina, <b>tieni premuta</b> una notifica del Programma → ⚙️ / Impostazioni.</li>' +

  box.innerHTML = h;

// apertura dalla notifica: #notifiche, #avvisi, #approva-46
function leggiHash(){
  var h = location.hash || '';
  if (!h) return;
  var m = h.match(/^#approva-(\d+)/);
  if (h === '#notifiche') S.vista = 'notifiche';
  else if (h === '#admin' && isAdmin()) S.vista = 'admin';
  else if (h === '#avvisi' && isDir()) S.vista = 'avvisi';
  else if (h === '#limiti' && (isLab() || isAdmin())) S.vista = 'limiti';
  else if (m && isDir()) { S.vista = 'approva'; S.approvaNum = Number(m[1]); }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

function caricaQr(){
  if (window.qrcode) return Promise.resolve();
  return new Promise(function(ok, ko){ var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; sc.integrity = 'sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k'; sc.crossOrigin = 'anonymous'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
}

function tgBox(){
  var box = $('tgbox'); if (!box) return;
  api('telegramMio', {}, true).then(function(t){
    if (S.sett) S.sett.telegram = t;
    var h = '<h2>Notifiche Telegram</h2>';
    if (!t.configurato) h += '<p style="font-size:14px">Il bot non è ancora attivo: lo configura l\'amministratore. Fino ad allora gli avvisi arrivano per email.</p>';
    else if (t.collegato) h += '<p style="font-size:14px"><span class="chip ok">Collegato</span> Ricevi gli avvisi da <b>@' + esc(t.bot) + '</b>: programma approvato, revisioni, con il tasto «Ricevuto».</p>' +
      '<div class="row"><button class="btn" id="tgprova">Invia un messaggio di prova</button><button class="btn err" id="tgstop">Scollega</button></div>';
    else h += '<p style="font-size:14px"><span class="chip warn">Non collegato</span> Collegati per ricevere subito sul telefono le uscite che ti riguardano e le modifiche.</p>' +
      '<button class="btn pri" id="tgattiva">Attiva Telegram</button><div id="tgqr" style="margin-top:12px"></div>';
    box.innerHTML = h;
    if ($('tgprova')) $('tgprova').onclick = function(){ api('telegramProva').then(function(){ toast('Messaggio inviato su Telegram'); }).catch(function(e){ toast(e.message); }); };
    if ($('tgstop')) $('tgstop').onclick = function(){ if (confirm('Scollegare Telegram? Non riceverai più gli avvisi lì.')) api('telegramScollega').then(tgBox).catch(function(e){ toast(e.message); }); };
    if ($('tgattiva')) $('tgattiva').onclick = function(){
      Promise.all([api('telegramLink'), caricaQr().catch(function(){})]).then(function(r){
        var l = r[0], qr = '';
        if (window.qrcode) { var q = window.qrcode(0, 'M'); q.addData('https://t.me/' + l.bot); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 2 }); }
        var cod = String(l.codice).slice(0, 3) + ' ' + String(l.codice).slice(3);
        var passo = function(n, t){ return '<li style="display:flex;gap:10px;align-items:flex-start"><span style="flex:0 0 28px;height:28px;border-radius:50%;background:var(--top);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center">' + n + '</span><div style="flex:1">' + t + '</div></li>'; };
        $('tgqr').innerHTML = '<ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:14.5px">' +
          passo(1, '<b>Apri il bot</b> sul telefono: premi «Apri il bot» qui sotto, oppure inquadra il QR, oppure cerca su Telegram <b>@' + esc(l.bot) + '</b>.' +
            '<div class="row" style="margin-top:8px;align-items:center"><a class="btn pri" href="https://t.me/' + esc(l.bot) + '" target="_blank" rel="noopener">Apri il bot</a>' +
            (qr ? '<span style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;line-height:0">' + qr + '</span>' : '') + '</div>') +
          passo(2, 'Se compare la scheda del bot premi <b>Messaggio</b>; se compare <b>Avvia</b> premilo.') +
          passo(3, '<b>Scrivi nel bot questo codice</b> e invia:<div class="mono" style="font-size:34px;font-weight:600;letter-spacing:.12em;margin:6px 0 2px;color:var(--top)">' + esc(cod) + '</div><span class="hint">Vale 30 minuti ed è solo tuo.</span>') +
          passo(4, 'Il bot risponde <b>«✅ Collegato!»</b>. <button class="btn small" id="tgfatto" style="margin-left:6px">Controlla</button>') + '</ol>';
        $('tgfatto').onclick = function(){ toast('Controllo…'); setTimeout(tgBox, 1500); };
        // controllo automatico per qualche minuto
        var n = 0, tm = setInterval(function(){ n++; if (!$('tgqr') || n > 24) return clearInterval(tm); api('telegramMio', {}, true).then(function(t){ if (t.collegato) { clearInterval(tm); toast('Telegram collegato'); tgBox(); } }); }, 10000);
      }).catch(function(e){ toast(e.message); });
    };
  }).catch(function(e){ box.innerHTML = '<h2>Notifiche Telegram</h2><div class="msg err">' + esc(e.message) + '</div>'; });
}

setInterval(function(){
  if (!S.token || !S.sett || document.hidden || S.ed || S.arch || S.vista !== 'compila' || nSpin > 0) return;
  api('settimana', {}, true).then(function(d){
    if (S.ed || S.vista !== 'compila' || S.arch) return;
    S.sett.notifiche = d.notifiche; aggiornaBadge();
    if (JSON.stringify(d.giorni) + JSON.stringify(d.bozze) === JSON.stringify(S.sett.giorni) + JSON.stringify(S.sett.bozze)) { S.sett = d; return; }
    var y = window.scrollY; S.sett = d; vCompila(); window.scrollTo(0, y);
  }).catch(function(){});
}, 45000);

if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
avvio();
</script>
